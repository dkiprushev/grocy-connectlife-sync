blueprint:
  name: Grocy ConnectLife — периодическая синхронизация
  description: >-
    Каждые 15 минут запускает ручные действия синхронизации инвентаря и
    выбранных списков покупок. Конфликты и ошибки записываются в журнал HA.
    Создание автоматизации из этого шаблона включает запись данных в обе системы.
    Удаления и конфликтующие изменения не разрешаются автоматически.
  domain: automation
  input:
    connectlife_list:
      name: Имя списка покупок ConnectLife
      description: Точное имя существующего списка ConnectLife.
      selector:
        text:
    grocy_list_id:
      name: ID списка покупок Grocy
      description: Числовой ID выбранного списка Grocy.
      default: 1
      selector:
        number:
          min: 1
          max: 2147483647
          step: 1
          mode: box

mode: single
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: "/15"

actions:
  - action: hisense_food_manager.sync_inventory_bidirectional
    response_variable: inventory_result
    continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ inventory_result is not defined or inventory_result.errors | default([]) | count > 0 or inventory_result.conflicts | default([]) | count > 0 }}"
    then:
      - action: system_log.write
        data:
          level: warning
          message: "Grocy ConnectLife: inventory result={{ inventory_result | default('action failed; see HA error log') }}"
  - action: hisense_food_manager.sync_shopping_bidirectional
    data:
      shopping_list_name: !input connectlife_list
      grocy_shopping_list_id: !input grocy_list_id
    response_variable: shopping_result
    continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ shopping_result is not defined or shopping_result.errors | default([]) | count > 0 or shopping_result.conflicts | default([]) | count > 0 }}"
    then:
      - action: system_log.write
        data:
          level: warning
          message: "Grocy ConnectLife: shopping result={{ shopping_result | default('action failed; see HA error log') }}"
