blueprint:
  name: Grocy ConnectLife — периодическая синхронизация
  description: >-
    Каждую минуту проверяет, пора ли синхронизировать инвентарь и покупки.
    При ошибках запросы выполняются реже: через 1, 2, 5 и 10 минут.
    Конфликты и изменения доступности записываются в журнал HA.
    Создание автоматизации из этого шаблона включает запись данных в обе системы.
    Удаления и конфликтующие изменения не разрешаются автоматически.
  domain: automation
  input:
    connectlife_list:
      name: Имя списка покупок ConnectLife
      description: Точное имя существующего списка ConnectLife.
      selector:
        text:
    grocy_list_id:
      name: ID списка покупок Grocy
      description: Числовой ID выбранного списка Grocy.
      default: 1
      selector:
        number:
          min: 1
          max: 2147483647
          step: 1
          mode: box

mode: single
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: "/1"

actions:
  - action: hisense_food_manager.sync_adaptive
    data:
      shopping_list_name: !input connectlife_list
      grocy_shopping_list_id: !input grocy_list_id
    response_variable: sync_result
